<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Reviews | Vitamix</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e8e8e8;
        }

        .header {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 24px 40px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
            flex-wrap: wrap;
        }

        .header h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 2rem;
            font-weight: 500;
            background: linear-gradient(135deg, #f39c12 0%, #e74c3c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.6);
            margin-top: 4px;
            font-size: 0.95rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }

        .locale-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
            margin-bottom: 32px;
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-group label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.5);
        }

        .filter-group select,
        .filter-group input[type="number"],
        .search-bar input {
            padding: 10px 14px;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }

        .filter-group select {
            min-width: 220px;
            cursor: pointer;
        }

        .filter-group select option {
            background: #1a1a2e;
            color: #fff;
        }

        .filter-group select:focus,
        .filter-group input[type="number"]:focus,
        .search-bar input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #f39c12;
            box-shadow: 0 0 0 3px rgba(243, 156, 18, 0.15);
        }

        .filter-group input[type="number"] {
            width: 100px;
        }

        .load-btn {
            padding: 10px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .load-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(243, 156, 18, 0.3);
        }

        .load-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .stats-bar {
            display: flex;
            gap: 24px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px 28px;
            min-width: 160px;
        }

        .stat-card .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 6px;
        }

        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 600;
            color: #f39c12;
        }

        .filters-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            align-items: flex-end;
            margin-bottom: 32px;
        }

        .search-bar {
            flex: 1;
            min-width: 280px;
        }

        .search-bar input {
            width: 100%;
            max-width: 500px;
            padding: 14px 20px;
        }

        .search-bar input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .rating-filters {
            display: flex;
            gap: 16px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .filter-status {
            display: flex;
            align-items: center;
            padding: 10px 0;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .filter-status .bv-loading {
            animation: pulse 1.5s ease-in-out infinite;
        }

        .filter-status .bv-ready {
            color: #2ecc71;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .export-btn {
            padding: 10px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .export-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            text-align: center;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #f39c12;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading p {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.6);
        }

        .loading-progress {
            margin-top: 12px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.45);
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
        }

        .error-message {
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid rgba(231, 76, 60, 0.3);
            border-radius: 12px;
            padding: 24px;
            color: #e74c3c;
            text-align: center;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            animation: fadeInUp 0.4s ease both;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: rgba(243, 156, 18, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0.3;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product-card.hidden {
            display: none;
        }

        .product-image-container {
            width: 100%;
            height: 220px;
            background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.02);
        }

        .product-image {
            width: 100%;
            height: 220px;
            position: relative;
            z-index: 1;
        }

        .product-image img {
            width: 100%;
            height: 220px;
            object-fit: contain;
            display: block;
            padding: 16px;
        }

        .product-image.placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.25);
            height: 100%;
            z-index: 1;
            position: relative;
        }

        .product-info {
            padding: 20px;
        }

        .product-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.2rem;
            font-weight: 500;
            color: #fff;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .product-sku {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 8px;
        }

        .product-reviews-id {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.08);
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .product-bv-rating {
            min-height: 24px;
            margin-bottom: 8px;
        }

        .product-link {
            display: inline-block;
            padding: 4px 10px;
            font-size: 0.75rem;
            background: rgba(243, 156, 18, 0.15);
            border: 1px solid rgba(243, 156, 18, 0.3);
            border-radius: 4px;
            color: #f39c12;
            text-decoration: none;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .product-link:hover {
            background: rgba(243, 156, 18, 0.25);
            border-color: #f39c12;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.5);
        }

        .no-results h3 {
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div>
                <h1>Product Reviews</h1>
                <p>Browse Bazaarvoice ratings for products by locale</p>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="locale-bar">
            <div class="filter-group">
                <label for="locale-select">Locale</label>
                <select id="locale-select">
                    <option value="us/en_us">US — English (us/en_us)</option>
                    <option value="ca/en_us">CA — English (ca/en_us)</option>
                    <option value="ca/fr_ca">CA — Français (ca/fr_ca)</option>
                    <option value="mx/en_us">MX — English (mx/en_us)</option>
                    <option value="mx/es_mx">MX — Español (mx/es_mx)</option>
                </select>
            </div>
            <button type="button" id="load-btn" class="load-btn">Load Products</button>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p id="loading-message">Loading products...</p>
            <div id="loading-progress" class="loading-progress"></div>
        </div>

        <div id="error" class="error-message" style="display: none;"></div>

        <div id="content" style="display: none;">
            <div class="stats-bar">
                <div class="stat-card">
                    <div class="label">Total Products</div>
                    <div class="value" id="total-count">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">Showing</div>
                    <div class="value" id="visible-count">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">With reviewsId</div>
                    <div class="value" id="reviews-id-count">0</div>
                </div>
            </div>

            <div class="filters-bar">
                <div class="search-bar">
                    <input
                        type="text"
                        id="search-input"
                        placeholder="Search products by name or reviewsId..."
                        autocomplete="off"
                    >
                </div>
                <div class="rating-filters">
                    <div class="filter-group">
                        <label for="min-reviews">Min Reviews</label>
                        <input
                            type="number"
                            id="min-reviews"
                            min="0"
                            value="0"
                            placeholder="0"
                        >
                    </div>
                    <div class="filter-group">
                        <label for="min-rating">Min Rating</label>
                        <input
                            type="number"
                            id="min-rating"
                            min="0"
                            max="5"
                            step="0.5"
                            value="0"
                            placeholder="0"
                        >
                    </div>
                    <div class="filter-status" id="filter-status">
                        <span class="bv-loading">Loading ratings...</span>
                    </div>
                    <button type="button" id="export-btn" class="export-btn">
                        Export TSV
                    </button>
                </div>
            </div>

            <div id="product-grid" class="product-grid"></div>

            <div id="no-results" class="no-results" style="display: none;">
                <h3>No products found</h3>
                <p>Try adjusting your search or filters</p>
            </div>
        </div>
    </div>

    <script type="module" src="reviews.js"></script>
</body>
</html>
