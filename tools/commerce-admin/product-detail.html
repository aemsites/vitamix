<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="Description" content="Vitamix Commerce Admin – Product detail" />
    <meta name="robots" content="noindex" />
    <title>Vitamix Commerce Admin – Product</title>
    <link rel="stylesheet" href="commerce-auth.css" />
    <link rel="stylesheet" href="pim.css" />
    <link rel="stylesheet" href="commerce-admin-chrome.css" />
    <link rel="stylesheet" href="detail.css" />
  </head>
  <body class="commerce-admin-body" data-commerce-header="subpage" data-commerce-header-page="Product">
    <div id="commerce-admin-auth-root" aria-live="polite">
      <p class="commerce-admin-auth-placeholder">Checking sign-in…</p>
    </div>
    <header id="commerce-admin-app-header"></header>
    <main class="pim-main pim-detail-main">
      <div class="pim-detail-toolbar" id="toolbar" style="display: none;">
        <a href="catalog.html" class="pim-detail-back-link">← Back to products</a>
        <div class="pim-detail-toolbar-right">
          <label for="productCatalogSelect">Catalog</label>
          <select id="productCatalogSelect" class="pim-index-select" aria-label="Product catalog locale">
            <option value="us/en_us">US</option>
            <option value="ca/en_us">Canada EN</option>
            <option value="ca/fr_ca">Canada FR</option>
            <option value="mx/en_us">Mexico EN</option>
            <option value="mx/es_mx">Mexico ES</option>
            <option value="vr/en_us">Rest of World EN</option>
          </select>
          <button type="button" class="pim-io-open-btn" id="productExportImportBtn" hidden>Export / import…</button>
          <label class="pim-edit-toggle" for="editModeCheckbox">
            <span class="pim-edit-toggle-label">Edit mode</span>
            <span class="pim-edit-toggle-track">
              <input type="checkbox" id="editModeCheckbox" class="pim-edit-toggle-input" disabled />
              <span class="pim-edit-toggle-thumb"></span>
            </span>
          </label>
          <a id="productProductionLink" class="pim-production-link" target="_blank" rel="noopener noreferrer" hidden>
            View on vitamix.com ↗
          </a>
        </div>
      </div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Loading product…</p>
      </div>

      <div class="error" id="error"></div>

      <div class="pim-detail-content" id="content"></div>
    </main>
    <script type="module" src="auth-page-boot.js"></script>
    <script type="module" src="commerce-admin-header.js"></script>
    <script type="module" src="detail.js"></script>
  </body>
</html>
